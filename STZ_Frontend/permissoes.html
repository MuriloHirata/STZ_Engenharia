<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permissões — STZ Engenharia</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="topbar"></div>
<div class="shell">
  <aside id="sidebar"></aside>
  <main class="workspace">
    <div class="page-head">
      <h1 class="page-title">Permissões de usuário</h1>
      <label class="filtros" style="margin:0">Usuário:
        <select class="select" id="alvo"></select>
      </label>
    </div>

    <div class="grid-3" id="modulos"></div>

    <section class="card" style="margin-top:16px">
      <div class="card-header">Atalhos úteis</div>
      <div class="card-body grid-3">
        <button class="btn btn-outline" id="atalho-usuarios">&#128101; Ver usuários</button>
        <button class="btn btn-outline" id="atalho-pref">&#9881; Preferências</button>
        <button class="btn btn-outline" id="atalho-log">&#128337; Log de auditoria</button>
      </div>
    </section>

    <section class="card" id="caixa-log" style="margin-top:16px" hidden>
      <div class="card-header">Log de auditoria <span class="acao">últimos 50 eventos</span></div>
      <div class="card-body" id="log-lista"></div>
    </section>

    <div class="sticky-footer">
      <span class="dica">Alterações de permissão valem para a sessão de demonstração (localStorage).</span>
      <button class="btn btn-outline" id="btn-descartar">Descartar</button>
      <button class="btn btn-primary" id="btn-salvar">Salvar alterações</button>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/app.js"></script>
<script>STZ.boot('permissoes', 'permissoes');</script>
</body>
</html>
