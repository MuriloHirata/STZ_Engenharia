<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes da lógica pura — STZ Frontend</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; margin: 32px; background: #f5f7fb; }
  h1 { font-family: system-ui, sans-serif; }
  li { padding: 4px 8px; margin: 2px 0; border-radius: 6px; font-size: 14px; }
  .pass { background: #e6f9f0; color: #10693f; }
  .fail { background: #fdecec; color: #a02226; }
  #resumo { font-family: system-ui, sans-serif; font-weight: 700; font-size: 18px; margin-top: 16px; }
</style>
</head>
<body>
<h1>Testes — js/logica.js (T3 do Plan.md)</h1>
<p>Abrir este arquivo no navegador: tudo verde = passou. Os asserts vivem em
<code>testes/logica_testes.js</code> (fonte única — o <code>scripts/check</code> roda os mesmos).</p>
<ul id="lista"></ul>
<p id="resumo"></p>

<script src="../js/logica.js"></script>
<script src="logica_testes.js"></script>
<script>
const lista = document.getElementById('lista');
let falhas = 0;
TESTES.forEach(([rot, fn]) => {
  let ok = false;
  try { ok = fn(); } catch (e) { ok = false; }
  if (!ok) falhas++;
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = (ok ? 'PASS — ' : 'FAIL — ') + rot;
  lista.appendChild(li);
});
const resumo = document.getElementById('resumo');
resumo.textContent = falhas === 0
  ? 'Todos os ' + TESTES.length + ' testes passaram.'
  : falhas + ' de ' + TESTES.length + ' testes FALHARAM.';
resumo.style.color = falhas === 0 ? '#10693f' : '#a02226';
</script>
</body>
</html>
